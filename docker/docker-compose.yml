version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: facts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 5s
      timeout: 5s
      retries: 20

  srl:
    build:
      context: ..
      dockerfile: docker/Dockerfile.srl
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  timex:
    build:
      context: ..
      dockerfile: docker/Dockerfile.timex
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/facts
      - QDRANT_URL=http://qdrant:6333
      - SRL_ENDPOINT=http://srl:8001/predict
      - TIMEX_ENDPOINT=http://timex:8002/parse
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      srl:
        condition: service_started
      timex:
        condition: service_started
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../data:/data
      - ../configs:/app/configs
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/facts
      - QDRANT_URL=http://qdrant:6333
      - PYTHONWARNINGS=ignore
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      srl:
        condition: service_started
      timex:
        condition: service_started
    command: ["python", "src/cli.py", "--blobs", "/data/blobs.jsonl", "--config", "configs/app.yaml", "--init-db"]

volumes:
  pgdata:
  qdrant_data:
