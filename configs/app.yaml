srl:
  mode: "service"        # "service" | "inproc"
  endpoint: "http://srl:8001/predict"  # used if mode=service
  model: "transformer-srl"

entity_linking:
  primary: "REL"         # "REL" | "BLINK" | "Bootleg" | "BELA" | "stub"
  fallback: "BLINK"
  backend: "auto"        # "auto" | "rel" | "blink" | "stub" - auto tries REL then BLINK then stub
  rel_data_dir: "/data/rel"          # embeddings, tfidf, wiki dumps
  min_conf_accept: 0.75
  use_ner: true         # Use spaCy NER for entity detection

timex:
  mode: "service"        # "service" | "none" | "sutime"
  endpoint: "http://timex:8002/parse"
  default_doc_time: "publish_time_from_video_table"

quantities:
  enable: true
  canonical_units:
    temperature: "celsius"
    length: "millimeter"
    mass: "gram"
    time: "second"

verification:
  enable: true
  evidence_window_sentences: 2
  retriever_embedding: "sentence-transformers/all-MiniLM-L6-v2"
  nli_model: "roberta-large-mnli"
  min_support: 0.6

dedup:
  minhash:
    n_perm: 128
    bands: 32
    rows_per_band: 4
    shingle_size: 5
    jaccard_equiv: 0.85
  jaccard_threshold: 0.5    # Min Jaccard for verified duplicates
  embed_fallback: true
  embed_model: "sentence-transformers/all-MiniLM-L6-v2"
  embed_cosine_min: 0.84

coreference:
  enable: true            # Enable coreference resolution
  backend: "neuralcoref"  # "neuralcoref" | "spacy-experimental" | "none"
  resolve_pronouns: true   # Resolve pronouns (it, this, that, they, etc.)
  cross_sentence: true     # Resolve references across sentence boundaries

mwe:
  enable: true            # Enable multi-word expression handling
  detect_phrasal_verbs: true   # Detect phrasal verbs (put together, heat up)
  detect_light_verbs: true     # Detect light verb constructions (make a decision)

db:
  dsn: "postgresql://postgres:postgres@db:5432/facts"

qdrant:
  url: "http://localhost:6333"
  collection_name: "fact_embeddings"
  vector_size: 384  # MiniLM-L6-v2 dimension
